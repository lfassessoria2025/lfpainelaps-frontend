<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>app</title>
    <script>
      // Aplica a classe .dark ANTES do React montar, pra não piscar o tema
      // errado por uma fração de segundo (next-themes não injeta isso
      // sozinho fora de Next.js) — mesma chave de storage que next-themes usa.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();

      // O bundle usa métodos imutáveis de Array em telas carregadas sob
      // demanda. Este fallback roda antes do módulo principal, inclusive
      // quando uma aba reaproveita um chunk antigo após um deploy.
      (function () {
        try {
          if (typeof Array.prototype.toSorted !== "function") {
            Object.defineProperty(Array.prototype, "toSorted", {
              configurable: true,
              writable: true,
              value: function (compareFn) {
                return Array.prototype.slice.call(this).sort(compareFn);
              },
            });
          }
          if (typeof Array.prototype.flatMap !== "function") {
            Object.defineProperty(Array.prototype, "flatMap", {
              configurable: true,
              writable: true,
              value: function (callback) {
                var origem = Array.prototype.slice.call(this);
                var resultado = [];
                origem.forEach(function (valor, indice) {
                  var item = callback(valor, indice, origem);
                  if (Array.isArray(item)) resultado.push.apply(resultado, item);
                  else resultado.push(item);
                });
                return resultado;
              },
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
